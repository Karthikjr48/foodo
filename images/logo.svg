<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
    
    <!-- Dark Inner Ring Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Glow Circle -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" opacity="0.6" />

  <!-- Main Background Badge -->
  <circle cx="50" cy="50" r="40" fill="url(#glowGrad)" filter="url(#shadow)" />

  <!-- Crossed Fork and Spoon Icon -->
  <g transform="translate(50, 48) scale(0.9)" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spoon (Diagonal left-down to right-up) -->
    <g transform="rotate(45)">
      <!-- Handle -->
      <line x1="0" y1="10" x2="0" y2="-22" stroke-width="4" />
      <!-- Spoon Head -->
      <ellipse cx="0" cy="-28" rx="7" ry="9" fill="#FFFFFF" stroke-width="2" />
    </g>

    <!-- Fork (Diagonal right-down to left-up) -->
    <g transform="rotate(-45)">
      <!-- Handle -->
      <line x1="0" y1="10" x2="0" y2="-20" stroke-width="4" />
      <!-- Fork base -->
      <path d="M -6 -20 L 6 -20 L 6 -32 L -6 -32 Z" fill="#FFFFFF" stroke-width="2" />
      <!-- Prongs -->
      <line x1="-5" y1="-32" x2="-5" y2="-40" stroke-width="3" />
      <line x1="-1.6" y1="-32" x2="-1.6" y2="-40" stroke-width="3" />
      <line x1="1.6" y1="-32" x2="1.6" y2="-40" stroke-width="3" />
      <line x1="5" y1="-32" x2="5" y2="-40" stroke-width="3" />
    </g>
  </g>

  <!-- Decorative Sparkles -->
  <path d="M 22 25 L 24 22 L 26 25 L 24 28 Z" fill="#FFFFFF" opacity="0.9" />
  <path d="M 76 72 L 77 70 L 78 72 L 77 74 Z" fill="#FFFFFF" opacity="0.9" />
</svg>
